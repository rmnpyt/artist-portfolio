version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    restart: always

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    expose:
      - "80"
    depends_on:
      - web
    restart: always
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.azam.rule=Host(`azamkashefikia.com`) || Host(`www.azamkashefikia.com`)"
      - "traefik.http.routers.azam.entrypoints=websecure"
      - "traefik.http.routers.azam.tls.certresolver=letsencrypt"
      - "traefik.http.services.azam.loadbalancer.server.port=80"

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  proxy:
    external: true
